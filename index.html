<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diário de Evolução</title>
    
    <!-- PWA Meta Tags Essenciais -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#fdf2f8">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192x192.png?text=DE">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- React, ReactDOM, Recharts & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: {
                            rose: '#F472B6', 
                            lavender: '#818CF8', 
                            light: '#FDF2F8', 
                            dark: '#0F172A'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base & Glassmorphism */
        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            background-color: #fdf2f8; 
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,0) 0, transparent 50%);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .dark .glass-card {
            background: rgba(30, 41, 59, 0.85) !important;
            border: 1px solid rgba(71, 85, 105, 0.5) !important;
            color: #f1f5f9;
        }
        .dark .glass-card label,
        .dark .glass-card h3 {
            color: #cbd5e1 !important;
        }
        .dark .glass-card input {
            color: #f1f5f9 !important;
            border-color: #475569 !important;
        }
        .dark .glass-card input::placeholder {
            color: #64748b !important;
        }
        .dark .glass-card textarea {
            background: rgba(15, 23, 42, 0.5) !important;
            color: #e2e8f0 !important;
        }
        .dark body {
            background-color: #0f172a !important;
        }
        .tab-bar-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(226, 232, 240, 0.6);
        }

        ::-webkit-scrollbar { display: none; } /* Oculta scrollbar mantendo funcionalidade */

        /* Inputs Range Customizados */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 10px 0; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 8px; cursor: pointer; background: #e2e8f0; border-radius: 999px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 24px; width: 24px; border-radius: 50%;
            background: #F472B6; cursor: pointer; -webkit-appearance: none; margin-top: -8px;
            box-shadow: 0 2px 6px rgba(244, 114, 182, 0.4); border: 2px solid #fff;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
        
        /* Animação Circular do Timer */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.5s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Correção para inputs de tempo */
        input[type="time"]::-webkit-calendar-picker-indicator {
            background: transparent;
            bottom: 0; color: transparent; cursor: pointer; height: auto; left: 0; position: absolute; right: 0; top: 0; width: auto;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen font-sans pb-24">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, Area, AreaChart, CartesianGrid, ReferenceLine } = window.Recharts;

        // --- SVGs Inline (Zero dependências externas, robusto para offline) ---
        const Icon = {
            Clock: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>,
            Book: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            Activity: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
            Edit: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
            Download: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
            Check: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            Bell: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
            Target: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        };

        // --- INJEÇÃO DE PWA DINÂMICA (App Instalável e Offline num único HTML) ---
        function setupPWA() {
            // 1. Manifest para "Add to Homescreen"
            const manifest = {
                name: "Diário de Evolução",
                short_name: "Evolução",
                start_url: ".",
                display: "standalone",
                background_color: "#FDF2F8",
                theme_color: "#F472B6",
                icons: [{ src: "https://via.placeholder.com/192x192.png?text=DE", sizes: "192x192", type: "image/png" }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${URL.createObjectURL(manifestBlob)}">`);

            // 2. Service Worker Inline para Cache Offline Verdadeiro
            const swCode = `
                const CACHE_NAME = 'depro-v2';
                self.addEventListener('install', e => {
                    self.skipWaiting();
                    // Como é um single file, fazer cache da raiz garante funcionamento offline
                    e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll([location.pathname]))); 
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(
                        caches.match(e.request).then(res => res || fetch(e.request).catch(() => caches.match(location.pathname)))
                    );
                });
            `;
            const swBlob = new Blob([swCode], {type: 'application/javascript'});
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(console.warn);
            }

            // 3. Permissão de Notificação Push
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }

        // --- UTILS & LÓGICA DE NEGÓCIO ---
        const getTodayStr = () => {
            const date = new Date();
            return new Date(date.getTime() - (date.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
        };

        const calculateTargets = (weight, height, age, objective) => {
            const w = parseFloat(weight);
            // Meta de Água Personalizada: 35ml por kg de peso
            const water = Math.round(w * 35);
            
            // Protocolo de Jejum Intermitente Personalizado
            let fastingHours = 14; 
            if(objective === 'emagrecer_rapido') fastingHours = 16;
            if(objective === 'saude') fastingHours = 12;
            if(objective === 'leve') fastingHours = 8;

            return { waterTarget: water, fastingHours };
        };

        // --- EMAIL GATE ---
        function EmailGateScreen({ onComplete }) {
            const [email, setEmail] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            useEffect(() => { window.scrollTo(0, 0); }, []);

            const isValidEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

            const handleSubmit = () => {
                if (!isValidEmail(email)) {
                    setError('Digite um e-mail válido para continuar.');
                    return;
                }
                setLoading(true);
                // Simula verificação (1.5s) para dar sensação de login real
                setTimeout(() => {
                    onComplete(email.toLowerCase().trim());
                }, 1500);
            };

            return (
                <div className="min-h-screen flex flex-col justify-center px-8 bg-white relative overflow-hidden animate-fade-in">
                    <div className="absolute top-[-10%] right-[-10%] w-72 h-72 bg-brand-rose/20 rounded-full blur-3xl"></div>
                    <div className="absolute bottom-[-10%] left-[-10%] w-72 h-72 bg-brand-lavender/20 rounded-full blur-3xl"></div>

                    <div className="z-10 w-full max-w-sm mx-auto">
                        <div className="text-center mb-10">
                            <div className="w-20 h-20 rounded-3xl bg-gradient-to-br from-brand-rose to-brand-lavender flex items-center justify-center text-4xl mx-auto mb-5 shadow-lg shadow-brand-rose/30">
                                🌸
                            </div>
                            <h1 className="text-2xl font-bold text-slate-800 mb-2">Bem-vinda ao Plano 21 Dias</h1>
                            <p className="text-slate-500 text-sm leading-relaxed">
                                Para acessar seu conteúdo exclusivo, confirme o e-mail usado na sua compra.
                            </p>
                        </div>

                        <div className="space-y-4">
                            <div>
                                <label className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 block">E-mail da compra</label>
                                <input
                                    type="email"
                                    placeholder="seu@email.com"
                                    value={email}
                                    onChange={e => { setEmail(e.target.value); setError(''); }}
                                    onKeyDown={e => e.key === 'Enter' && handleSubmit()}
                                    className="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 focus:border-brand-rose outline-none text-base transition-colors"
                                    disabled={loading}
                                />
                                {error && <p className="text-xs text-red-500 mt-2 font-medium">{error}</p>}
                            </div>

                            <button
                                type="button"
                                onClick={handleSubmit}
                                disabled={!email || loading}
                                className="w-full py-4 bg-gradient-to-r from-brand-rose to-brand-lavender text-white rounded-2xl font-bold shadow-lg shadow-brand-rose/30 disabled:opacity-50 active:scale-95 transition-all flex items-center justify-center gap-2">
                                {loading ? (
                                    <>
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                                        Verificando acesso...
                                    </>
                                ) : 'Acessar meu conteúdo →'}
                            </button>
                        </div>

                        <p className="text-center text-xs text-slate-400 mt-6 leading-relaxed">
                            🔒 Acesso exclusivo para alunas.<br/>Este conteúdo é intransferível e protegido.
                        </p>
                    </div>
                </div>
            );
        }

        // --- MAIN APP ---
        function App() {
            const [isLoaded, setIsLoaded] = useState(false);
            const [emailVerified, setEmailVerified] = useState(false);
            const [user, setUser] = useState(null); 
            const [logs, setLogs] = useState({}); 
            const [fasting, setFasting] = useState({ isActive: false, startTime: null });
            const [activeTab, setActiveTab] = useState('diary'); // Diário como tela inicial
            const [darkMode, setDarkMode] = useState(false);
            const [showTutorial, setShowTutorial] = useState(false);
            const [showNotifSettings, setShowNotifSettings] = useState(false);
            const [notifSettings, setNotifSettings] = useState(() => {
                try {
                    const saved = localStorage.getItem('depro_notif');
                    return saved ? JSON.parse(saved) : {
                        jejumLembrete: true, jejumHorario: '21:00',
                        aguaLembrete: true, aguaHorario: '10:00',
                        pesagemLembrete: true, pesagemHorario: '07:30',
                        marcosJejum: true,
                    };
                } catch(e) {
                    return { jejumLembrete: true, jejumHorario: '21:00', aguaLembrete: true, aguaHorario: '10:00', pesagemLembrete: true, pesagemHorario: '07:30', marcosJejum: true };
                }
            });
            const notifTimers = useRef([]);

            useEffect(() => { window.scrollTo(0, 0); }, [activeTab]);

            // Hydration do LocalStorage
            useEffect(() => {
                const savedUser = JSON.parse(localStorage.getItem('depro_user'));
                const savedLogs = JSON.parse(localStorage.getItem('depro_logs')) || {};
                const savedFasting = JSON.parse(localStorage.getItem('depro_fasting')) || { isActive: false, startTime: null };
                const savedEmail = localStorage.getItem('depro_email');
                const savedDarkMode = localStorage.getItem('depro_darkMode') === 'true';
                const hasSeenTutorial = localStorage.getItem('depro_tutorial_seen');
                const savedNotif = localStorage.getItem('depro_notif');
                if (savedNotif) { try { setNotifSettings(JSON.parse(savedNotif)); } catch(e){} }

                if (savedEmail) setEmailVerified(true);
                if (savedUser) {
                    setUser(savedUser);
                    // Mostra tutorial na primeira vez que entra na app (após onboarding)
                    if (!hasSeenTutorial) {
                        setShowTutorial(true);
                        localStorage.setItem('depro_tutorial_seen', 'true');
                    }
                }
                setLogs(savedLogs);
                setFasting(savedFasting);
                setDarkMode(savedDarkMode);
                
                setupPWA();
                setIsLoaded(true);
            }, []);

            // Aplicar modo dark na página
            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem('depro_darkMode', darkMode);
            }, [darkMode]);

            // Salvar no LocalStorage automaticamente
            useEffect(() => {
                if (isLoaded) {
                    if (user) localStorage.setItem('depro_user', JSON.stringify(user));
                    localStorage.setItem('depro_logs', JSON.stringify(logs));
                    localStorage.setItem('depro_fasting', JSON.stringify(fasting));
                }
            }, [user, logs, fasting, isLoaded]);

            // Salvar configurações de notificação
            useEffect(() => {
                localStorage.setItem('depro_notif', JSON.stringify(notifSettings));
                scheduleNotifications(notifSettings, fasting);
            }, [notifSettings]);


            // Sistema de Notificações
            const notify = (title, body) => {
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification(title, { body, icon: "https://via.placeholder.com/192x192.png?text=DE" });
                }
            };

            // Agendamento de notificações locais (via setTimeout)
            const scheduleNotifications = (settings, fastingState) => {
                // Limpar timers antigos
                notifTimers.current.forEach(t => clearTimeout(t));
                notifTimers.current = [];
                if (!("Notification" in window) || Notification.permission !== "granted") return;
                const scheduleDaily = (horario, title, body) => {
                    const [h, m] = horario.split(':').map(Number);
                    const now = new Date();
                    const target = new Date();
                    target.setHours(h, m, 0, 0);
                    if (target <= now) target.setDate(target.getDate() + 1);
                    const delay = target - now;
                    const t = setTimeout(() => {
                        new Notification(title, { body, icon: "https://via.placeholder.com/192x192.png?text=DE" });
                    }, delay);
                    notifTimers.current.push(t);
                };
                if (settings.jejumLembrete) scheduleDaily(settings.jejumHorario, "⏱️ Hora do Jejum!", "Está na hora de iniciar seu protocolo de jejum. Vamos lá!");
                if (settings.aguaLembrete) scheduleDaily(settings.aguaHorario, "💧 Beba Água!", "Lembre-se de manter sua hidratação em dia. Sua meta te espera!");
                if (settings.pesagemLembrete) scheduleDaily(settings.pesagemHorario, "⚖️ Pesagem Matinal", "Hora de registrar seu peso do dia. Abra o Diário agora!");
            };

            // Calcular streak de dias consecutivos

            const streak = useMemo(() => {
                let count = 0;
                const today = new Date();
                for (let i = 0; i < 21; i++) {
                    const d = new Date(today);
                    d.setDate(d.getDate() - i);
                    const ds = new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                    if (logs[ds] && (logs[ds].weight || logs[ds].water > 0)) count++;
                    else if (i > 0) break;
                }
                return count;
            }, [logs]);

            const handleEmailVerified = (email) => {
                localStorage.setItem('depro_email', email);
                setEmailVerified(true);
            };

            if (!isLoaded) return null;
            if (!emailVerified) return <EmailGateScreen onComplete={handleEmailVerified} />;
            if (!user) return <OnboardingScreen onComplete={setUser} />;

            return (
                <div className={`max-w-md mx-auto relative min-h-screen overflow-x-hidden ${darkMode ? 'dark bg-slate-900' : 'bg-brand-light'}`}>
                    {/* Header Pessoal */}
                    <header className={`px-6 pt-8 pb-4 flex justify-between items-center z-10 relative ${darkMode ? 'bg-slate-800' : ''}`}>
                        <div>
                            <p className={`text-sm font-medium ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>Jornada 21 Dias ✨</p>
                            <h1 className={`text-2xl font-bold ${darkMode ? 'text-white' : 'bg-clip-text text-transparent bg-gradient-to-r from-brand-rose to-brand-lavender'}`}>
                                Oi, {user.name.split(' ')[0]}
                            </h1>
                            {(() => {
                                const startStr = user.startDate;
                                const todayStr = getTodayStr();
                                const startD = new Date(startStr + 'T00:00:00');
                                const todayD = new Date(todayStr + 'T00:00:00');
                                const diffDays = Math.round((todayD - startD) / (1000*60*60*24));
                                const day = Math.min(diffDays + 1, 21);
                                const msgs = [
                                    `Dia ${day} — começo de tudo! Você deu o primeiro passo 🌸`,
                                    `Dia ${day} — você está mais perto do que ontem! ✨`,
                                    `Dia ${day} — cada hora de jejum conta! 💪`,
                                    `Incrível, já no dia ${day}! Consistência é tudo 🌟`,
                                    `Dia ${day} — o processo está funcionando, confie! 🔥`,
                                ];
                                const msg = msgs[(day - 1) % msgs.length];
                                return <p className={`text-xs mt-0.5 font-medium ${darkMode ? 'text-slate-300' : 'text-slate-500'}`}>{msg}</p>;
                            })()}
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => setShowNotifSettings(true)} className={`w-12 h-12 rounded-full flex items-center justify-center shadow-sm text-lg transition-all ${darkMode ? 'bg-slate-700 hover:bg-slate-600' : 'glass-card'}`}>
                                ⚙️
                            </button>
                            <button data-tutorial="darkmode-btn" onClick={() => setDarkMode(!darkMode)} className={`w-12 h-12 rounded-full flex items-center justify-center shadow-sm text-lg transition-all ${darkMode ? 'bg-slate-700 hover:bg-slate-600' : 'glass-card'}`}>
                                {darkMode ? '☀️' : '🌙'}
                            </button>
                        </div>
                    </header>

                    {/* Roteamento de Abas */}
                    <main className={`px-6 pb-28 ${darkMode ? 'bg-slate-900' : ''}`}>
                        {activeTab === 'diary' && <DiaryTab user={user} logs={logs} setLogs={setLogs} darkMode={darkMode} streak={streak} />}
                        {activeTab === 'timer' && <TimerTab user={user} fasting={fasting} setFasting={setFasting} notify={notify} darkMode={darkMode} />}
                        {activeTab === 'dash' && <DashboardTab user={user} logs={logs} darkMode={darkMode} />}
                        {activeTab === 'library' && <LibraryTab darkMode={darkMode} />}
                    </main>

                    {/* Navegação Inferior (App-like) */}
                    <nav className={`fixed bottom-0 left-0 right-0 w-full pb-safe pt-2 px-2 z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] ${darkMode ? 'bg-slate-800 border-t border-slate-700' : 'tab-bar-glass'}`}>
                        <div className="max-w-md mx-auto flex justify-around items-center h-16">
                        <div data-tutorial="tab-diary"><TabBtn icon={<Icon.Edit/>} label="Diário" active={activeTab==='diary'} onClick={()=>setActiveTab('diary')} darkMode={darkMode} /></div>
                            <div data-tutorial="tab-timer"><TabBtn icon={<Icon.Clock/>} label="Jejum" active={activeTab==='timer'} onClick={()=>setActiveTab('timer')} darkMode={darkMode} /></div>
                            <div data-tutorial="tab-dash"><TabBtn icon={<Icon.Activity/>} label="Evolução" active={activeTab==='dash'} onClick={()=>setActiveTab('dash')} darkMode={darkMode} /></div>
                            <div data-tutorial="tab-library"><TabBtn icon={<Icon.Book/>} label="Biblioteca" active={activeTab==='library'} onClick={()=>setActiveTab('library')} darkMode={darkMode} /></div>
                        </div>
                    </nav>

                    {/* Tutorial Overlay */}
                    {showTutorial && <TutorialOverlay onClose={() => setShowTutorial(false)} darkMode={darkMode} />}

                    {/* Notification Settings Panel */}
                    {showNotifSettings && (
                        <NotifSettingsPanel
                            settings={notifSettings}
                            setSettings={setNotifSettings}
                            onClose={() => setShowNotifSettings(false)}
                            darkMode={darkMode}

        // 3. TELA TIMER (Jejum Intermitente Ativo)

            const elapsedMs = fasting.isActive ? (now - fasting.startTime) : 0;

            // Resumo semanal

                const today = new Date();
                let fastDays = 0, totalWater = 0, weightStart = null, weightEnd = null, daysCount = 0;
                for (let i = 6; i >= 0; i--) {

                    d.setDate(d.getDate() - i);
                    const ds = new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                    const log = logs[ds];
                    if (log) {
                        daysCount++;
                        if (log.habits && log.habits['jejum']) fastDays++;
                        totalWater += (log.water || 0);
                        if (log.weight) {
                            if (weightStart === null) weightStart = parseFloat(log.weight);
                            weightEnd = parseFloat(log.weight);
                        }
                    }
                }
                const weightDiff = (weightStart && weightEnd) ? (weightEnd - weightStart).toFixed(1) : null;
                const avgWater = daysCount ? Math.round(totalWater / daysCount) : 0;
                return { fastDays, avgWater, weightDiff, daysCount };

        // --- INDEXEDDB HELPERS PARA CACHE DE PDFs ---
        const IDB = {
            _db: null,
            open() {
                if (this._db) return Promise.resolve(this._db);
                return new Promise((res, rej) => {
                    const req = indexedDB.open('biblioteca_cache', 1);
                    req.onupgradeneeded = e => e.target.result.createObjectStore('pdfs', { keyPath: 'id' });
                    req.onsuccess = e => { this._db = e.target.result; res(this._db); };
                    req.onerror = e => rej(e.target.error);
                });
            },
            async get(id) {
                const db = await this.open();
                return new Promise((res, rej) => {
                    const req = db.transaction('pdfs', 'readonly').objectStore('pdfs').get(id);
                    req.onsuccess = e => res(e.target.result || null);
                    req.onerror = e => rej(e.target.error);
                });
            },
            async put(id, blob) {
                const db = await this.open();
                return new Promise((res, rej) => {
                    const req = db.transaction('pdfs', 'readwrite').objectStore('pdfs').put({ id, blob, ts: Date.now() });
                    req.onsuccess = () => res();
                    req.onerror = e => rej(e.target.error);
                });
            }
        };

                { id: '1wuHPWnwZaBy1bPzv7OXcfTt6BXHJ4mK7', title: "Coma Certo, Emagreça Rápido", subtitle: "Guia Completo de Alimentação", color: "from-emerald-400 to-teal-500", emoji: "🥗" },

                { id: '16uopoLV9tChvWf6EIAwY9MTjLbA7uX8q', title: "Diário de Evolução", subtitle: "Seu Registro de Transformação", color: "from-brand-rose to-brand-lavender", emoji: "📓" },
                { id: '1lU_kFrGB-2-AadJD34VeQbOd2XzEiLgG', title: "Mente Magra", subtitle: "Destrave Seus Bloqueios", color: "from-amber-400 to-orange-500", emoji: "🧠" },
                { id: '1DWn9Fc_-c6hY_fmrfpKqprUrXOU41gUb', title: "Nunca Mais Engorde", subtitle: "Mantenha o Resultado Para Sempre", color: "from-violet-400 to-purple-500", emoji: "🏆" },
                { id: '12zU17awEmhMgras54Q3Xvx7ifobOgP3n', title: "Plano 21 Dias", subtitle: "Jejum Inteligente Oficial", color: "from-rose-400 to-pink-600", emoji: "📚" },
                { id: '15CBqowVjJevpeUcIhx1Wg6ipxZh0F6pV', title: "Seu Metabolismo", subtitle: "Entenda e Acelere Seu Corpo", color: "from-orange-400 to-red-500", emoji: "⚡" },
            ];

            // status por id: 'idle' | 'downloading' | 'cached' | 'opening' | 'error'
            const [statuses, setStatuses] = useState({});
            const [progress, setProgress] = useState({});

            // Ao montar, checar quais já estão em cache
            useEffect(() => {
                BOOKS.forEach(async (book) => {
                    try {
                        const cached = await IDB.get(book.id);
                        if (cached) {
                            setStatuses(prev => ({ ...prev, [book.id]: 'cached' }));
                        }
                    } catch(e) {}
                });
            }, []);

            const setStatus = (id, status) => setStatuses(prev => ({ ...prev, [id]: status }));
            const setBookProgress = (id, pct) => setProgress(prev => ({ ...prev, [id]: pct }));

            const handleOpen = async (book) => {
                const status = statuses[book.id] || 'idle';
                if (status === 'downloading') return; // já está baixando

                // Se em cache, abre direto
                if (status === 'cached') {
                    try {
                        const record = await IDB.get(book.id);
                        // Só abre como blob se for um PDF de verdade
                        if (record && record.blob && record.blob.type === 'application/pdf') {
                            const url = URL.createObjectURL(record.blob);
                            window.open(url, '_blank');
                        } else {
                            // Marcador ou tipo errado: abre pelo Drive
                            window.open(`https://drive.google.com/file/d/${book.id}/view`, '_blank');
                        }
                    } catch(e) {
                        // Se erro ao buscar do IDB, abre pelo Drive
                        window.open(`https://drive.google.com/file/d/${book.id}/view`, '_blank');
                    }
                    // Mantém status como 'cached' sem resetar
                    return;
                }

                // Baixar e cachear
                setStatus(book.id, 'downloading');
                setBookProgress(book.id, 0);

                const downloadUrl = `https://drive.google.com/uc?export=download&id=${book.id}`;

                try {
                    const response = await fetch(downloadUrl);
                    if (!response.ok) throw new Error('fetch failed');

                    const contentLength = response.headers.get('content-length');
                    const total = contentLength ? parseInt(contentLength) : 0;
                    const reader = response.body.getReader();
                    const chunks = [];
                    let received = 0;

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        chunks.push(value);
                        received += value.length;
                        if (total > 0) setBookProgress(book.id, Math.round((received / total) * 100));
                    }

                    const blob = new Blob(chunks, { type: 'application/pdf' });
                    await IDB.put(book.id, blob);
                    setStatus(book.id, 'cached');
                    const url = URL.createObjectURL(blob);
                    window.open(url, '_blank');

                } catch(err) {
                    // CORS bloqueou: abre pelo Drive e marca como "baixado via Drive"
                    window.open(`https://drive.google.com/file/d/${book.id}/view`, '_blank');
                    // Simula cache marcando que o usuário já acessou
                    try {
                        // Salva um marcador (sem o blob) pra não baixar de novo
                        await IDB.put(book.id, new Blob(['cached_marker'], { type: 'text/plain' }));
                        setStatus(book.id, 'cached');
                    } catch(e) {
                        setStatus(book.id, 'error');
                    }
                }
            };

            const [showPWAInstall, setShowPWAInstall] = useState(false);

            return (
                <div className={`animate-slide-up space-y-6 ${darkMode ? 'text-white' : ''}`}>

                    {!showPWAInstall && (

                                ← Voltar para biblioteca
                            </button>
                            <PWAInstallStep name="Você" onNext={() => setShowPWAInstall(false)} onBack={() => setShowPWAInstall(false)} darkMode={darkMode} />
                        </div>
                    )}

                    {!showPWAInstall && (
                        <>
                            <div className="grid grid-cols-1 gap-3">
                                {BOOKS.map((book) => {
                                    const status = statuses[book.id] || 'idle';
                                    const pct = progress[book.id] || 0;
                                    const isCached = status === 'cached';
                                    const isDownloading = status === 'downloading';
                                    const isOpening = status === 'opening';

                                    return (
                                        <div key={book.id} onClick={() => handleOpen(book)}
                                            className={`p-4 rounded-2xl flex items-center justify-between cursor-pointer shadow-sm border transition-all active:scale-95
                                                ${isCached ? darkMode ? 'border-emerald-500/50 bg-emerald-500/10' : 'border-emerald-100 bg-emerald-50/30' : darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-100'}
                                                ${isDownloading ? 'opacity-90 cursor-wait' : ''}`}>
                                            <div className="flex items-center gap-4 flex-1 min-w-0">
                                                <div className={`w-14 h-14 rounded-xl bg-gradient-to-br ${book.color} flex items-center justify-center text-2xl shadow-inner shrink-0`}>
                                                    {book.emoji}
                                                </div>
                                                <div className="min-w-0 flex-1">
                                                    <h3 className={`font-bold text-sm leading-snug ${darkMode ? 'text-slate-200' : 'text-slate-800'}`}>{book.title}</h3>
                                                    <p className={`text-xs font-medium mt-0.5 ${darkMode ? 'text-slate-500' : 'text-slate-500'}`}>{book.subtitle}</p>
                                                    {isDownloading && (
                                                        <div className="mt-2">
                                                            <div className={`h-1.5 rounded-full overflow-hidden ${darkMode ? 'bg-slate-700' : 'bg-slate-100'}`}>
                                                                <div className="h-full bg-gradient-to-r from-brand-rose to-brand-lavender rounded-full transition-all duration-300"
                                                                    style={{ width: pct > 0 ? `${pct}%` : '30%', animation: pct === 0 ? 'pulse 1.5s infinite' : 'none' }}></div>
                                                            </div>
                                                            <p className={`text-[10px] mt-1 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{pct > 0 ? `${pct}% baixado...` : 'Baixando...'}</p>
                                                        </div>
                                                    )}
                                                    {isCached && !isDownloading && (
                                                        <p className={`text-[10px] font-semibold mt-1 ${darkMode ? 'text-emerald-400' : 'text-emerald-500'}`}>✓ Salvo no dispositivo</p>
                                                    )}
                                                </div>
                                            </div>
                                            <div className={`w-10 h-10 rounded-full flex items-center justify-center shrink-0 ml-2 transition-colors
                                                ${isCached ? darkMode ? 'bg-emerald-500/30 text-emerald-400' : 'bg-emerald-100 text-emerald-600' : darkMode ? 'bg-slate-700 text-slate-500' : 'bg-slate-50 text-slate-400'}
                                                ${isOpening ? 'bg-brand-rose/10 text-brand-rose' : ''}`}>
                                                {isDownloading ? (
                                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="animate-spin text-brand-rose">
                                                        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                                                    </svg>
                                                ) : isCached ? (
                                                    <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                                                        <polyline points="20 6 9 17 4 12"/>
                                                    </svg>
                                                ) : (
                                                    <Icon.Download />
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <p className={`text-center text-xs pb-2 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>
                                📁 PDFs salvos ficam disponíveis mesmo sem internet
                            </p>
                        </>
                    )}
                </div>
            );
        }

        // Utils UI (Componentes Reutilizáveis)
        function SliderRow({ icon, label, value, onChange, reverseColor = false }) {

            if (!reverseColor) {
                if (value >= 8) colorClass = 'text-emerald-500';

        // Painel de Configurações de Notificação
        function NotifSettingsPanel({ settings, setSettings, onClose, darkMode }) {
            const [permStatus, setPermStatus] = useState(
                "Notification" in window ? Notification.permission : 'unsupported'
            );

            const requestPermission = async () => {
                if (!("Notification" in window)) return;
                const result = await Notification.requestPermission();
                setPermStatus(result);
            };

            const update = (key, val) => setSettings(prev => ({ ...prev, [key]: val }));

            const bg = darkMode ? 'bg-slate-800' : 'bg-white';
            const text = darkMode ? 'text-white' : 'text-slate-900';
            const sub = darkMode ? 'text-slate-400' : 'text-slate-500';
            const card = darkMode ? 'bg-slate-700 border-slate-600' : 'bg-slate-50 border-slate-100';

            const ToggleRow = ({ label, desc, enabled, onToggle, timeKey, timeVal }) => (
                <div className={`rounded-2xl border p-4 ${card}`}>
                    <div className="flex items-center justify-between mb-2">
                        <div>
                            <p className={`font-semibold text-sm ${text}`}>{label}</p>
                            <p className={`text-xs ${sub}`}>{desc}</p>
                        </div>
                        <div onClick={onToggle} className={`w-12 h-6 rounded-full cursor-pointer transition-colors relative ${enabled ? 'bg-brand-rose' : darkMode ? 'bg-slate-600' : 'bg-slate-200'}`}>

                    {enabled && timeKey && (

                        </div>
                    )}
                </div>
            );

            return (
                <div className="fixed inset-0 z-[998] flex items-end justify-center" onClick={onClose}>
                    <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" />
                    <div className={`relative w-full max-w-md rounded-t-3xl p-6 pb-10 shadow-2xl ${bg} max-h-[85vh] overflow-y-auto`}

                                        <button onClick={requestPermission}
                                            className="w-full py-2.5 bg-gradient-to-r from-brand-rose to-brand-lavender text-white rounded-xl font-bold text-sm">
                                            Ativar Notificações
                                        </button>

                        <div className="space-y-3">

                                label="⏱️ Lembrete de Jejum"
                                desc="Avisa na hora certa de iniciar seu jejum"

        // Tutorial Spotlight (destaca o elemento real na tela)
        function TutorialOverlay({ onClose, darkMode }) {
            const [step, setStep] = useState(0);
            const [spotRect, setSpotRect] = useState(null);

            // Cada step aponta para um seletor real do DOM
            const steps = [
                {
                    selector: '[data-tutorial="tab-diary"]',

                    position: 'top', // tooltip acima do spotlight

                {
                    selector: '[data-tutorial="tab-timer"]',
                    title: '⏱️ Aba Jejum',
                    description: 'Inicie e acompanhe seu jejum em tempo real. Veja em qual estágio do corpo você está a cada hora!',
                    position: 'top',
                },
                {
                    selector: '[data-tutorial="tab-dash"]',
                    title: '📊 Aba Evolução',
                    description: 'Seus gráficos de peso, adesão e streak de dias ficam aqui. Veja sua transformação acontecendo!',
                    position: 'top',
                },
                {
                    selector: '[data-tutorial="tab-library"]',

                    description: 'Seus materiais VIP exclusivos. Baixe os PDFs uma vez e leia offline quando quiser.',
                    position: 'top',
                },
                {
                    selector: '[data-tutorial="darkmode-btn"]',
                    title: '🌙 Modo Escuro',
                    description: 'Use este botão para alternar entre tema claro e escuro. Perfeito para usar à noite!',
                    position: 'bottom',
                },
            ];

            useEffect(() => {
                const measureSpot = () => {
                    const sel = steps[step].selector;
                    const el = document.querySelector(sel);
                    if (el) {
                        const r = el.getBoundingClientRect();
                        setSpotRect({ top: r.top, left: r.left, width: r.width, height: r.height });
                    } else {
                        setSpotRect(null);
                    }
                };
                measureSpot();
                window.addEventListener('resize', measureSpot);
                return () => window.removeEventListener('resize', measureSpot);
            }, [step]);

            const handleNext = () => {
                if (step < steps.length - 1) setStep(step + 1);
                else onClose();
            };

            const pad = 10;
            const sr = spotRect;
            const tooltipOnTop = steps[step].position === 'top';

            return (
                <div className="fixed inset-0 z-[999]" style={{ pointerEvents: 'auto' }} onClick={handleNext}>
                    {/* Escurecimento com buraco recortado */}
                    {sr && (
                        <svg className="absolute inset-0 w-full h-full" style={{ pointerEvents: 'none' }}>
                            <defs>
                                <mask id="spotlight-mask">
                                    <rect width="100%" height="100%" fill="white" />
                                    <rect
                                        x={sr.left - pad} y={sr.top - pad}
                                        width={sr.width + pad * 2} height={sr.height + pad * 2}
                                        rx="16" fill="black"
                                    />
                                </mask>
                            </defs>
                            <rect width="100%" height="100%" fill="rgba(0,0,0,0.72)" mask="url(#spotlight-mask)" />
                            {/* Borda brilhante ao redor do spotlight */}
                            <rect
                                x={sr.left - pad} y={sr.top - pad}
                                width={sr.width + pad * 2} height={sr.height + pad * 2}
                                rx="16" fill="none" stroke="#F472B6" strokeWidth="2.5"
                                style={{ filter: 'drop-shadow(0 0 8px #F472B6)' }}
                            />
                        </svg>
                    )}

                    {/* Tooltip card */}
                    {sr && (
                        <div
                            onClick={e => e.stopPropagation()}
                            className="absolute z-[1000] w-72 bg-white rounded-2xl shadow-2xl p-5"
                            style={tooltipOnTop ? {
                                bottom: window.innerHeight - sr.top + pad + 16,
                                left: Math.min(Math.max(sr.left + sr.width / 2 - 144, 12), window.innerWidth - 300),
                            } : {
                                top: sr.top + sr.height + pad + 16,
                                left: Math.min(Math.max(sr.left + sr.width / 2 - 144, 12), window.innerWidth - 300),
                            }}
                        >
                            {/* Seta apontando para o elemento */}
                            <div className="absolute w-4 h-4 bg-white rotate-45"
                                style={tooltipOnTop ? {
                                    bottom: -8, left: Math.min(Math.max(sr.left + sr.width / 2 - (Math.min(Math.max(sr.left + sr.width / 2 - 144, 12), window.innerWidth - 300)), 20), 248),
                                    boxShadow: '2px 2px 4px rgba(0,0,0,0.08)'
                                } : {
                                    top: -8, left: Math.min(Math.max(sr.left + sr.width / 2 - (Math.min(Math.max(sr.left + sr.width / 2 - 144, 12), window.innerWidth - 300)), 20), 248),
                                    boxShadow: '-2px -2px 4px rgba(0,0,0,0.08)'
                                }}
                            />
                            <h3 className="font-bold text-slate-900 text-base mb-1">{steps[step].title}</h3>
                            <p className="text-slate-500 text-[13px] leading-relaxed mb-4">{steps[step].description}</p>

                            {/* Dots de progresso */}
                            <div className="flex items-center gap-1.5 mb-4">
                                {steps.map((_, idx) => (
                                    <div key={idx} className={`h-1.5 rounded-full transition-all ${idx === step ? 'bg-brand-rose w-5' : idx < step ? 'bg-rose-200 w-2' : 'bg-slate-200 w-2'}`} />
                                ))}
                            </div>

                            <div className="flex gap-2">
                                {step > 0 && (
                                    <button onClick={() => setStep(step - 1)}
                                        className="flex-1 py-2.5 rounded-xl font-bold text-sm bg-slate-100 text-slate-600">
                                        ← Anterior
                                    </button>
                                )}
                                <button onClick={handleNext}
                                    className="flex-1 py-2.5 bg-gradient-to-r from-brand-rose to-brand-lavender text-white rounded-xl font-bold text-sm shadow-md">
                                    {step === steps.length - 1 ? 'Começar! 🚀' : 'Próximo →'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Fallback se não achou o elemento */}
                    {!sr && (
                        <div className="absolute inset-0 flex items-center justify-center p-6">
                            <div className="bg-white rounded-2xl p-6 max-w-xs w-full shadow-2xl">
                                <p className="font-bold text-slate-800 mb-2">{steps[step].title}</p>
                                <p className="text-slate-500 text-sm mb-4">{steps[step].description}</p>
                                <button onClick={handleNext} className="w-full py-3 bg-gradient-to-r from-brand-rose to-brand-lavender text-white rounded-xl font-bold">
                                    {step === steps.length - 1 ? 'Começar!' : 'Próximo →'}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function TabBtn({ icon, label, active, onClick, darkMode }) {
            return (
                <button onClick={onClick} className={`flex flex-col items-center justify-center w-16 transition-colors ${active ? 'text-brand-rose' : darkMode ? 'text-slate-500 hover:text-slate-400' : 'text-slate-400 hover:text-slate-600'}`}>
                    <div className={`${active ? 'transform -translate-y-1 scale-110 drop-shadow-md' : ''} transition-all duration-300`}>
                        {icon}
                    </div>
                    <span className={`text-[10px] font-bold mt-1 tracking-wide ${darkMode && !active ? 'text-slate-500' : ''}`}>{label}</span>
                </button>
            );
        }

        // Inicialização React Segura
        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        }
    </script>
</body>
</html>
