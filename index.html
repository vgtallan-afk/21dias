<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diário de Evolução</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F472B6">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192x192.png?text=DE">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        rose: { 50: '#fff1f2', 300: '#fda4af', 400: '#fb7185', 500: '#f43f5e' },
                        lavender: { 50: '#eef2ff', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1' },
                        dark: { bg: '#0f172a', card: '#1e293b', border: '#334155' }
                    },
                    animation: {
                        'breathe': 'breathe 8s ease-in-out infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                    },
                    keyframes: {
                        breathe: {
                            '0%, 100%': { transform: 'scale(1)', opacity: '0.8' },
                            '50%': { transform: 'scale(1.4)', opacity: '0.4' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Glassmorphism utilities */
        .glass {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .tab-bar-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .tab-bar-glass {
            background: rgba(15, 23, 42, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Hide scrollbar but keep functionality */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        /* Circular Progress */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-rose-50 via-white to-lavender-50 dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-500">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- SVGs INLINE PARA NÃO DEPENDER DE LIBS EXTERNAS ---
        const Icons = {
            Home: () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>,
            Activity: () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>,
            Plus: () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>,
            Heart: () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>,
            Menu: () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>,
            Check: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>,
            Moon: () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>,
            Sun: () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
            Copy: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
        };

        // --- UTILS ---
        const getTodayDateString = () => {
            const tzoffset = (new Date()).getTimezoneOffset() * 60000;
            return (new Date(Date.now() - tzoffset)).toISOString().split('T')[0];
        };

        function App() {
            // --- STATE MANAGEMENT ---
            const [isLoaded, setIsLoaded] = useState(false);
            const [user, setUser] = useState({ name: '', initialWeight: '', goalWeight: '', setupDone: false });
            const [darkMode, setDarkMode] = useState(false);
            const [activeTab, setActiveTab] = useState('home');
            
            // Jejum
            const [fasting, setFasting] = useState({ isFasting: false, startTime: null });
            
            // Registros
            const [logs, setLogs] = useState({}); // { "YYYY-MM-DD": { weight, fastingTime, food, water, cycle } }
            
            // Perfil Biológico
            const [bio, setBio] = useState({ weight: '', age: '', height: '', goalWeight: '', objective: 'emagrecer' });

            // --- LOCAL STORAGE EFFECTS ---
            useEffect(() => {
                const savedUser = JSON.parse(localStorage.getItem('de_user'));
                const savedTheme = localStorage.getItem('de_theme');
                const savedFasting = JSON.parse(localStorage.getItem('de_fasting'));
                const savedLogs = JSON.parse(localStorage.getItem('de_logs'));
                const savedBio = JSON.parse(localStorage.getItem('de_bio'));

                if (savedUser) setUser(savedUser);
                if (savedTheme === 'dark') setDarkMode(true);
                if (savedFasting) setFasting(savedFasting);
                if (savedLogs) setLogs(savedLogs);
                if (savedBio) setBio(savedBio);
                
                setIsLoaded(true);
            }, []);

            useEffect(() => {
                if (isLoaded) {
                    localStorage.setItem('de_user', JSON.stringify(user));
                    localStorage.setItem('de_fasting', JSON.stringify(fasting));
                    localStorage.setItem('de_logs', JSON.stringify(logs));
                    localStorage.setItem('de_bio', JSON.stringify(bio));
                    
                    if (darkMode) {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('de_theme', 'dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('de_theme', 'light');
                    }
                }
            }, [user, darkMode, fasting, logs, bio, isLoaded]);

            if (!isLoaded) return null; // Previne hidratação incorreta

            // --- CÁLCULOS GERAIS ---
            const calculateStreak = () => {
                let streak = 0;
                let currentDate = new Date();
                
                // Zera as horas para comparar apenas datas
                currentDate.setHours(0,0,0,0);

                while (true) {
                    const dateStr = new Date(currentDate.getTime() - (currentDate.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                    if (logs[dateStr]) {
                        streak++;
                        currentDate.setDate(currentDate.getDate() - 1);
                    } else {
                        // Se não tem registro hoje, checa ontem antes de quebrar o streak
                        if (streak === 0) {
                            currentDate.setDate(currentDate.getDate() - 1);
                            const yesterdayStr = new Date(currentDate.getTime() - (currentDate.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                            if(logs[yesterdayStr]){
                                streak++;
                                currentDate.setDate(currentDate.getDate() - 1);
                                continue;
                            }
                        }
                        break;
                    }
                }
                return streak;
            };

            const streak = calculateStreak();

            // --- RENDER CONDICIONAL ---
            if (!user.setupDone) {
                return <SetupScreen user={user} setUser={setUser} setBio={setBio} />;
            }

            return (
                <div className="pb-24 max-w-md mx-auto w-full relative min-h-screen">
                    {/* Header Padrão */}
                    <header className="p-6 pt-8 flex justify-between items-center">
                        <div>
                            <p className="text-sm text-slate-500 dark:text-slate-400 font-medium">Oi, maravilhosa! ✨</p>
                            <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-rose-400 to-indigo-500">
                                {user.name}
                            </h1>
                        </div>
                        <div className="flex items-center gap-1 bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400 px-3 py-1.5 rounded-full font-bold shadow-sm">
                            <span>🔥</span> {streak}
                        </div>
                    </header>

                    {/* Conteúdo Dinâmico das Abas */}
                    <main className="px-6 pb-6">
                        {activeTab === 'home' && <HomeScreen user={user} fasting={fasting} setFasting={setFasting} logs={logs} />}
                        {activeTab === 'biohub' && <BioHubScreen bio={bio} setBio={setBio} user={user} />}
                        {activeTab === 'registrar' && <RegisterScreen logs={logs} setLogs={setLogs} setActiveTab={setActiveTab} />}
                        {activeTab === 'sos' && <SOSScreen />}
                        {activeTab === 'mais' && <MoreScreen darkMode={darkMode} setDarkMode={setDarkMode} logs={logs} user={user} streak={streak} />}
                    </main>

                    {/* Tab Bar Fixa */}
                    <nav className="fixed bottom-0 left-0 w-full tab-bar-glass pb-safe pt-2 px-2 z-50">
                        <div className="max-w-md mx-auto flex justify-between items-center">
                            <TabButton icon={<Icons.Home />} label="Home" active={activeTab === 'home'} onClick={() => setActiveTab('home')} />
                            <TabButton icon={<Icons.Activity />} label="Bio-Hub" active={activeTab === 'biohub'} onClick={() => setActiveTab('biohub')} />
                            
                            {/* Botão Centralizado Maior */}
                            <button 
                                onClick={() => setActiveTab('registrar')}
                                className="relative -top-5 bg-gradient-to-tr from-rose-400 to-indigo-500 text-white p-4 rounded-full shadow-lg hover:shadow-rose-500/30 transition-transform active:scale-95"
                            >
                                <Icons.Plus />
                            </button>
                            
                            <TabButton icon={<Icons.Heart />} label="SOS" active={activeTab === 'sos'} onClick={() => setActiveTab('sos')} />
                            <TabButton icon={<Icons.Menu />} label="Mais" active={activeTab === 'mais'} onClick={() => setActiveTab('mais')} />
                        </div>
                    </nav>
                </div>
            );
        }

        // --- COMPONENTES DAS TELAS ---

        // 1. Tela de Setup
        function SetupScreen({ user, setUser, setBio }) {
            const [form, setForm] = useState({ name: '', initialWeight: '', goalWeight: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                if(form.name && form.initialWeight && form.goalWeight) {
                    setUser({ ...form, setupDone: true });
                    // Pré-preenche o bio
                    setBio(prev => ({ ...prev, weight: form.initialWeight, goalWeight: form.goalWeight }));
                }
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 animate-fade-in relative overflow-hidden">
                    {/* Elementos decorativos */}
                    <div className="absolute top-0 left-0 w-64 h-64 bg-rose-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
                    <div className="absolute top-0 right-0 w-64 h-64 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
                    
                    <div className="w-full max-w-sm z-10 glass p-8 rounded-[2rem] shadow-2xl">
                        <div className="text-center mb-8">
                            <span className="text-4xl mb-4 block">🌸</span>
                            <h1 className="text-2xl font-bold mb-2">Bem-vinda à sua nova jornada</h1>
                            <p className="text-slate-500 text-sm">Vamos configurar seu diário de forma suave.</p>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block text-sm font-medium mb-1 pl-2">Como quer ser chamada?</label>
                                <input required type="text" placeholder="Seu nome" 
                                    className="w-full p-4 rounded-2xl border-none bg-white/50 focus:ring-2 focus:ring-rose-400 outline-none transition-all shadow-inner"
                                    value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                            </div>
                            <div className="flex gap-4">
                                <div className="flex-1">
                                    <label className="block text-sm font-medium mb-1 pl-2">Peso atual (kg)</label>
                                    <input required type="number" step="0.1" placeholder="Ex: 75.0" 
                                        className="w-full p-4 rounded-2xl border-none bg-white/50 focus:ring-2 focus:ring-rose-400 outline-none shadow-inner"
                                        value={form.initialWeight} onChange={e => setForm({...form, initialWeight: e.target.value})} />
                                </div>
                                <div className="flex-1">
                                    <label className="block text-sm font-medium mb-1 pl-2">Meta (kg)</label>
                                    <input required type="number" step="0.1" placeholder="Ex: 65.0" 
                                        className="w-full p-4 rounded-2xl border-none bg-white/50 focus:ring-2 focus:ring-indigo-400 outline-none shadow-inner"
                                        value={form.goalWeight} onChange={e => setForm({...form, goalWeight: e.target.value})} />
                                </div>
                            </div>
                            
                            <button type="submit" className="w-full py-4 mt-4 bg-gradient-to-r from-rose-400 to-indigo-500 text-white font-bold rounded-2xl shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all active:scale-95">
                                Começar Jornada ✨
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // 2. Tela Home
        function HomeScreen({ user, fasting, setFasting, logs }) {
            const [now, setNow] = useState(Date.now());

            useEffect(() => {
                if (fasting.isFasting) {
                    const interval = setInterval(() => setNow(Date.now()), 1000);
                    return () => clearInterval(interval);
                }
            }, [fasting.isFasting]);

            const toggleFasting = () => {
                if (fasting.isFasting) {
                    // Finaliza jejum
                    setFasting({ isFasting: false, startTime: null });
                } else {
                    // Inicia jejum
                    setFasting({ isFasting: true, startTime: Date.now() });
                }
            };

            // Cálculos do Jejum
            const elapsedHours = fasting.isFasting ? (now - fasting.startTime) / (1000 * 60 * 60) : 0;
            const targetHours = 16; // Padrão 16h para UI visual
            const progress = Math.min((elapsedHours / targetHours) * 100, 100);
            
            // Fases Metabólicas
            let phase = "Alimentação";
            let phaseColor = "text-emerald-500";
            if(fasting.isFasting) {
                if (elapsedHours < 4) { phase = "Açúcar no sangue caindo"; phaseColor = "text-blue-500"; }
                else if (elapsedHours < 12) { phase = "Digestão & Estabilização"; phaseColor = "text-indigo-500"; }
                else if (elapsedHours < 16) { phase = "🔥 Queima de Gordura"; phaseColor = "text-orange-500"; }
                else if (elapsedHours < 24) { phase = "⚡ Cetose Leve"; phaseColor = "text-purple-500"; }
                else { phase = "✨ Autofagia (Renovação)"; phaseColor = "text-rose-500"; }
            }

            const formatTime = (ms) => {
                let totalSeconds = Math.floor(ms / 1000);
                let hours = Math.floor(totalSeconds / 3600);
                let minutes = Math.floor((totalSeconds % 3600) / 60);
                let seconds = totalSeconds % 60;
                return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            };

            // Renderizar mini-calendário da semana
            const renderWeekHabits = () => {
                const days = [];
                const today = new Date();
                today.setHours(0,0,0,0);
                
                // Pega de Seg a Dom da semana atual
                const dayOfWeek = today.getDay(); // 0=Dom, 1=Seg...
                const distanceToMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
                
                const monday = new Date(today);
                monday.setDate(today.getDate() - distanceToMonday);

                for(let i=0; i<7; i++) {
                    const current = new Date(monday);
                    current.setDate(monday.getDate() + i);
                    const dateStr = new Date(current.getTime() - (current.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                    const isToday = current.getTime() === today.getTime();
                    const hasLog = !!logs[dateStr];
                    const isFuture = current.getTime() > today.getTime();

                    const dayNames = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
                    const dayLabel = dayNames[current.getDay()];

                    days.push(
                        <div key={i} className="flex flex-col items-center gap-2">
                            <span className="text-xs text-slate-400 font-medium">{dayLabel}</span>
                            <div className={`w-8 h-8 rounded-full flex items-center justify-center transition-all ${
                                hasLog ? 'bg-gradient-to-br from-emerald-400 to-teal-500 text-white shadow-md' : 
                                isToday ? 'border-2 border-indigo-400 bg-indigo-50 dark:bg-indigo-900/20' : 
                                'bg-slate-100 dark:bg-slate-800'
                            }`}>
                                {hasLog ? <Icons.Check /> : <span className="w-1.5 h-1.5 rounded-full bg-slate-300 dark:bg-slate-600"></span>}
                            </div>
                        </div>
                    );
                }
                return days;
            };

            return (
                <div className="space-y-6 animate-slide-up">
                    {/* Card Jejum */}
                    <div className="glass p-6 rounded-3xl text-center relative overflow-hidden shadow-sm">
                        <h2 className="font-bold text-lg mb-6">Status do Jejum</h2>
                        
                        {/* Timer Circular */}
                        <div className="relative w-48 h-48 mx-auto mb-6 flex items-center justify-center">
                            <svg className="absolute top-0 left-0 w-full h-full" viewBox="0 0 100 100">
                                <circle className="text-slate-200 dark:text-slate-700 stroke-current" strokeWidth="6" cx="50" cy="50" r="45" fill="transparent"></circle>
                                <circle 
                                    className="text-indigo-500 progress-ring__circle stroke-current drop-shadow-md" 
                                    strokeWidth="6" strokeLinecap="round" cx="50" cy="50" r="45" fill="transparent"
                                    strokeDasharray="283" 
                                    strokeDashoffset={283 - (283 * progress) / 100}
                                ></circle>
                            </svg>
                            <div className="z-10 flex flex-col items-center">
                                {fasting.isFasting ? (
                                    <>
                                        <span className="text-3xl font-bold tracking-tighter tabular-nums">
                                            {formatTime(now - fasting.startTime)}
                                        </span>
                                        <span className="text-xs font-medium uppercase tracking-wider text-slate-500 mt-1">Horas</span>
                                    </>
                                ) : (
                                    <span className="text-slate-400 font-medium">Toque para<br/>iniciar</span>
                                )}
                            </div>
                        </div>

                        {fasting.isFasting && (
                            <div className="mb-6 bg-slate-50 dark:bg-slate-800/50 py-2 px-4 rounded-xl inline-block">
                                <span className="text-xs text-slate-500 block mb-1">Fase atual:</span>
                                <span className={`font-bold text-sm ${phaseColor} animate-pulse`}>{phase}</span>
                            </div>
                        )}

                        <button 
                            onClick={toggleFasting}
                            className={`w-full py-4 rounded-2xl font-bold transition-all transform active:scale-95 shadow-md ${
                                fasting.isFasting 
                                ? 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300' 
                                : 'bg-gradient-to-r from-indigo-500 to-purple-500 text-white hover:shadow-lg'
                            }`}
                        >
                            {fasting.isFasting ? 'Encerrar Jejum' : 'Iniciar Jejum Agora'}
                        </button>
                    </div>

                    {/* Card Hábitos */}
                    <div className="glass p-6 rounded-3xl shadow-sm">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="font-bold">Hábitos da Semana</h2>
                            <span className="text-xs text-emerald-500 font-bold bg-emerald-100 dark:bg-emerald-900/30 px-2 py-1 rounded-md">Consistência</span>
                        </div>
                        <div className="flex justify-between">
                            {renderWeekHabits()}
                        </div>
                    </div>
                </div>
            );
        }

        // 3. Tela Bio-Hub
        function BioHubScreen({ bio, setBio, user }) {
            const [localBio, setLocalBio] = useState(bio);
            const [showResults, setShowResults] = useState(false);

            // Cálculos
            const weight = parseFloat(localBio.weight) || 0;
            const height = parseFloat(localBio.height) || 0;
            const age = parseFloat(localBio.age) || 0;
            
            // IMC
            const imc = (weight && height) ? (weight / Math.pow(height/100, 2)).toFixed(1) : 0;
            let imcStatus = "Normal";
            let imcColor = "bg-emerald-500";
            let markerPos = 50; // Porcentagem na barra
            
            if(imc > 0) {
                if(imc < 18.5) { imcStatus = "Abaixo do peso"; imcColor = "bg-blue-400"; markerPos = 15; }
                else if(imc < 25) { imcStatus = "Peso Ideal"; imcColor = "bg-emerald-500"; markerPos = 50; }
                else if(imc < 30) { imcStatus = "Sobrepeso"; imcColor = "bg-yellow-400"; markerPos = 75; }
                else { imcStatus = "Atenção"; imcColor = "bg-rose-500"; markerPos = 95; }
            }

            // TDEE (Mifflin-St Jeor) Mulheres
            const basal = (10 * weight) + (6.25 * height) - (5 * age) - 161;
            let tdee = basal * 1.2; // Sedentária
            
            let calories = Math.round(tdee);
            if (localBio.objective === 'emagrecer') calories -= 400; // Déficit leve
            if (localBio.objective === 'ganhar') calories += 300;

            // Água e Proteína
            const water = Math.round(weight * 35); // ml
            let proteinFactor = localBio.objective === 'emagrecer' ? 1.8 : (localBio.objective === 'ganhar' ? 2.0 : 1.2);
            const protein = Math.round(weight * proteinFactor);

            const handleSave = (e) => {
                e.preventDefault();
                setBio(localBio);
                setShowResults(true);
            };

            return (
                <div className="space-y-6 animate-slide-up">
                    <div className="glass p-6 rounded-3xl">
                        <h2 className="font-bold text-lg mb-4">Seu Perfil Biológico</h2>
                        <form onSubmit={handleSave} className="space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-medium mb-1 text-slate-500 pl-1">Peso (kg)</label>
                                    <input required type="number" step="0.1" value={localBio.weight} onChange={e => setLocalBio({...localBio, weight: e.target.value})} 
                                        className="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border-none outline-none focus:ring-2 focus:ring-indigo-400 transition-all" />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium mb-1 text-slate-500 pl-1">Altura (cm)</label>
                                    <input required type="number" value={localBio.height} onChange={e => setLocalBio({...localBio, height: e.target.value})} 
                                        className="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border-none outline-none focus:ring-2 focus:ring-indigo-400 transition-all" />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium mb-1 text-slate-500 pl-1">Idade</label>
                                    <input required type="number" value={localBio.age} onChange={e => setLocalBio({...localBio, age: e.target.value})} 
                                        className="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border-none outline-none focus:ring-2 focus:ring-indigo-400 transition-all" />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium mb-1 text-slate-500 pl-1">Objetivo</label>
                                    <select value={localBio.objective} onChange={e => setLocalBio({...localBio, objective: e.target.value})}
                                        className="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border-none outline-none focus:ring-2 focus:ring-indigo-400 appearance-none text-sm">
                                        <option value="emagrecer">Emagrecer</option>
                                        <option value="manter">Manter peso</option>
                                        <option value="ganhar">Ganhar massa</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" className="w-full py-3 bg-slate-800 dark:bg-slate-100 text-white dark:text-slate-900 font-bold rounded-xl active:scale-95 transition-transform">
                                Calcular Meu Plano
                            </button>
                        </form>
                    </div>

                    {showResults && age > 0 && height > 0 && (
                        <div className="space-y-4 animate-fade-in">
                            <h3 className="font-bold text-lg px-2">Suas Metas Diárias ✨</h3>
                            
                            <div className="grid grid-cols-2 gap-4">
                                <div className="glass p-5 rounded-3xl flex flex-col items-center justify-center text-center">
                                    <span className="text-2xl mb-1">💧</span>
                                    <span className="text-sm text-slate-500">Água</span>
                                    <span className="font-bold text-xl">{water} <span className="text-sm font-normal">ml</span></span>
                                </div>
                                <div className="glass p-5 rounded-3xl flex flex-col items-center justify-center text-center">
                                    <span className="text-2xl mb-1">🥩</span>
                                    <span className="text-sm text-slate-500">Proteína</span>
                                    <span className="font-bold text-xl">{protein} <span className="text-sm font-normal">g</span></span>
                                </div>
                                <div className="glass p-5 rounded-3xl flex flex-col items-center justify-center text-center col-span-2">
                                    <span className="text-sm text-slate-500 mb-1">Calorias Recomendadas (Aprox.)</span>
                                    <span className="font-bold text-3xl text-indigo-500">{calories} <span className="text-base font-normal text-slate-500">kcal/dia</span></span>
                                    <p className="text-xs text-slate-400 mt-2">Baseado no seu objetivo de forma suave.</p>
                                </div>
                            </div>

                            {/* Card IMC Visual */}
                            <div className="glass p-5 rounded-3xl">
                                <div className="flex justify-between items-center mb-4">
                                    <span className="text-sm font-medium">Seu IMC: <span className="font-bold">{imc}</span></span>
                                    <span className={`text-xs font-bold px-2 py-1 rounded-md text-white ${imcColor}`}>{imcStatus}</span>
                                </div>
                                <div className="relative h-3 rounded-full bg-slate-200 flex overflow-hidden">
                                    <div className="h-full w-[20%] bg-blue-300"></div>
                                    <div className="h-full w-[40%] bg-emerald-400"></div>
                                    <div className="h-full w-[20%] bg-yellow-400"></div>
                                    <div className="h-full w-[20%] bg-rose-400"></div>
                                </div>
                                {/* Marker indicator */}
                                <div className="relative mt-2 h-4">
                                    <div className="absolute top-0 w-3 h-3 bg-slate-800 dark:bg-white rounded-full transform -translate-x-1.5 transition-all duration-1000" style={{ left: `${markerPos}%` }}></div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 4. Tela de Registro
        function RegisterScreen({ logs, setLogs, setActiveTab }) {
            const today = getTodayDateString();
            const existingLog = logs[today] || {};
            
            const [form, setForm] = useState({
                weight: existingLog.weight || '',
                fastingTime: existingLog.fastingTime || '',
                food: existingLog.food || '',
                water: existingLog.water || 0,
                cycle: existingLog.cycle || 'folicular'
            });

            const [showSuccess, setShowSuccess] = useState(false);

            // Máscara de tempo HH:MM
            const handleTimeChange = (e) => {
                let val = e.target.value.replace(/\D/g, '');
                if (val.length > 2) {
                    val = val.substring(0, 2) + ':' + val.substring(2, 4);
                }
                setForm({...form, fastingTime: val});
            };

            const handleSave = (e) => {
                e.preventDefault();
                setLogs({ ...logs, [today]: form });
                setShowSuccess(true);
                setTimeout(() => {
                    setShowSuccess(false);
                    setActiveTab('home');
                }, 1500);
            };

            return (
                <div className="animate-slide-up">
                    {showSuccess ? (
                        <div className="glass p-10 rounded-3xl flex flex-col items-center justify-center text-center animate-fade-in h-[60vh]">
                            <div className="w-20 h-20 bg-emerald-100 dark:bg-emerald-900/30 rounded-full flex items-center justify-center mb-4">
                                <span className="text-4xl">✨</span>
                            </div>
                            <h2 className="text-2xl font-bold mb-2">Registro Salvo!</h2>
                            <p className="text-slate-500">Um dia de cada vez, amiga. Você está indo super bem!</p>
                        </div>
                    ) : (
                        <div className="glass p-6 rounded-3xl">
                            <h2 className="font-bold text-xl mb-6">O que rolou hoje? 📝</h2>
                            <form onSubmit={handleSave} className="space-y-5">
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium mb-1 pl-1">Peso Hoje (kg)</label>
                                        <input type="number" step="0.1" value={form.weight} onChange={e => setForm({...form, weight: e.target.value})} 
                                            className="w-full p-4 rounded-2xl bg-white/50 dark:bg-slate-800/50 border-none outline-none focus:ring-2 focus:ring-rose-400" placeholder="Ex: 68.5" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium mb-1 pl-1">Tempo de Jejum</label>
                                        <input type="text" value={form.fastingTime} onChange={handleTimeChange} placeholder="HH:MM" 
                                            className="w-full p-4 rounded-2xl bg-white/50 dark:bg-slate-800/50 border-none outline-none focus:ring-2 focus:ring-rose-400 text-center tracking-widest font-mono" />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium mb-1 pl-1">Como você se alimentou?</label>
                                    <textarea value={form.food} onChange={e => setForm({...form, food: e.target.value})} rows="3"
                                        className="w-full p-4 rounded-2xl bg-white/50 dark:bg-slate-800/50 border-none outline-none focus:ring-2 focus:ring-rose-400 resize-none"
                                        placeholder="Comi comida de verdade, evitei açúcar..."></textarea>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium mb-2 pl-1">Copos de Água (250ml)</label>
                                    <div className="flex items-center gap-4 bg-white/50 dark:bg-slate-800/50 p-2 rounded-2xl">
                                        <button type="button" onClick={() => setForm({...form, water: Math.max(0, form.water - 1)})} className="w-12 h-12 flex items-center justify-center bg-white dark:bg-slate-700 rounded-xl shadow-sm text-xl font-bold active:scale-95">-</button>
                                        <div className="flex-1 text-center font-bold text-2xl text-blue-500">
                                            {form.water} <span className="text-sm font-normal text-slate-400">copos</span>
                                        </div>
                                        <button type="button" onClick={() => setForm({...form, water: form.water + 1})} className="w-12 h-12 flex items-center justify-center bg-blue-500 text-white rounded-xl shadow-sm text-xl font-bold active:scale-95">+</button>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium mb-1 pl-1">Fase do Ciclo 🌸</label>
                                    <select value={form.cycle} onChange={e => setForm({...form, cycle: e.target.value})}
                                        className="w-full p-4 rounded-2xl bg-white/50 dark:bg-slate-800/50 border-none outline-none focus:ring-2 focus:ring-rose-400 appearance-none">
                                        <option value="folicular">🌱 Folicular (Energia subindo)</option>
                                        <option value="ovulacao">🌸 Ovulação (Pico de energia)</option>
                                        <option value="lutea">🍂 Lútea (Mais fome/cansaço)</option>
                                        <option value="menstruacao">🩸 Menstruação (Descanso)</option>
                                    </select>
                                </div>

                                <button type="submit" className="w-full py-4 bg-gradient-to-r from-rose-400 to-indigo-500 text-white font-bold rounded-2xl shadow-lg hover:shadow-xl active:scale-95 transition-all mt-4">
                                    Salvar Registro de Hoje
                                </button>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        // 5. Tela SOS Calma
        function SOSScreen() {
            const [isActive, setIsActive] = useState(false);
            const [text, setText] = useState("Toque para Respirar");

            useEffect(() => {
                let interval;
                if(isActive) {
                    setText("Inspire profundo...");
                    let cycle = 0;
                    interval = setInterval(() => {
                        cycle++;
                        if(cycle % 2 === 1) setText("Segure... Expire devagar...");
                        else setText("Inspire profundo...");
                    }, 4000);
                } else {
                    setText("Toque para Respirar");
                }
                return () => clearInterval(interval);
            }, [isActive]);

            return (
                <div className="animate-slide-up flex flex-col items-center justify-center min-h-[70vh]">
                    <div className="text-center mb-12">
                        <h2 className="text-3xl font-bold mb-2">SOS Calma 🧘‍♀️</h2>
                        <p className="text-slate-500">Bateu a ansiedade ou vontade de comer sem fome? Pare por 1 minuto.</p>
                    </div>

                    <div 
                        onClick={() => setIsActive(!isActive)}
                        className="relative w-64 h-64 flex items-center justify-center cursor-pointer"
                    >
                        {/* Círculos de respiração */}
                        <div className={`absolute w-full h-full bg-rose-200/50 dark:bg-rose-500/20 rounded-full transition-all duration-1000 ${isActive ? 'animate-breathe' : ''}`}></div>
                        <div className={`absolute w-48 h-48 bg-indigo-200/50 dark:bg-indigo-500/20 rounded-full transition-all duration-1000 delay-75 ${isActive ? 'animate-breathe' : ''}`}></div>
                        
                        {/* Centro */}
                        <div className="absolute w-32 h-32 glass rounded-full flex flex-col items-center justify-center text-center shadow-xl z-10 p-4">
                            <span className="font-bold text-sm leading-tight text-slate-700 dark:text-slate-200">{text}</span>
                        </div>
                    </div>

                    {isActive && (
                        <p className="mt-12 text-center text-sm font-medium text-slate-500 animate-fade-in max-w-xs">
                            "Nenhum doce vale mais que a paz de estar no controle da sua própria vida."
                        </p>
                    )}
                </div>
            );
        }

        // 6. Tela Mais
        function MoreScreen({ darkMode, setDarkMode, logs, user, streak }) {
            const [copied, setCopied] = useState(false);

            const handleCopy = () => {
                const text = `🌸 Diário de Evolução da ${user.name}\n🔥 Ofensiva: ${streak} dias de consistência!\n\n"Construindo minha melhor versão, um dia de cada vez." ✨`;
                navigator.clipboard.writeText(text);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <div className="space-y-4 animate-slide-up">
                    <h2 className="font-bold text-xl mb-4 pl-2">Configurações</h2>
                    
                    {/* Modo Escuro */}
                    <div className="glass p-5 rounded-2xl flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-slate-100 dark:bg-slate-800 rounded-lg text-indigo-500">
                                {darkMode ? <Icons.Moon /> : <Icons.Sun />}
                            </div>
                            <span className="font-medium">Modo Escuro</span>
                        </div>
                        <button 
                            onClick={() => setDarkMode(!darkMode)}
                            className={`w-14 h-8 rounded-full p-1 transition-colors ${darkMode ? 'bg-indigo-500' : 'bg-slate-300'}`}
                        >
                            <div className={`w-6 h-6 bg-white rounded-full shadow-md transform transition-transform ${darkMode ? 'translate-x-6' : 'translate-x-0'}`}></div>
                        </button>
                    </div>

                    {/* Copiar Resumo */}
                    <div onClick={handleCopy} className="glass p-5 rounded-2xl flex justify-between items-center cursor-pointer active:scale-95 transition-transform">
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-slate-100 dark:bg-slate-800 rounded-lg text-rose-500">
                                <Icons.Copy />
                            </div>
                            <div>
                                <span className="font-medium block">Resumo para Stories</span>
                                <span className="text-xs text-slate-500">Copie seu progresso para postar</span>
                            </div>
                        </div>
                        {copied ? <span className="text-xs font-bold text-emerald-500">Copiado!</span> : <Icons.Check />}
                    </div>

                    {/* Instalação */}
                    <div className="glass p-5 rounded-2xl mt-6">
                        <h3 className="font-bold mb-3 flex items-center gap-2">📱 Como instalar este App</h3>
                        <div className="space-y-4 text-sm text-slate-600 dark:text-slate-400">
                            <div className="bg-white/50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-100 dark:border-slate-700">
                                <strong className="text-slate-800 dark:text-slate-200 block mb-1">No iPhone (Safari):</strong>
                                <p>1. Toque no ícone de "Compartilhar" (quadrado com seta para cima) na barra inferior.</p>
                                <p>2. Role para baixo e escolha <strong>"Adicionar à Tela de Início"</strong>.</p>
                            </div>
                            <div className="bg-white/50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-100 dark:border-slate-700">
                                <strong className="text-slate-800 dark:text-slate-200 block mb-1">No Android (Chrome):</strong>
                                <p>1. Toque nos 3 pontinhos no canto superior direito.</p>
                                <p>2. Escolha <strong>"Adicionar à tela inicial"</strong> ou "Instalar aplicativo".</p>
                            </div>
                        </div>
                    </div>
                    
                    <p className="text-center text-xs text-slate-400 mt-8 pb-4">Feito com carinho ❤️ para você.</p>
                </div>
            );
        }

        // Componente Menor: Botão da Tab
        function TabButton({ icon, label, active, onClick }) {
            return (
                <button 
                    onClick={onClick}
                    className={`flex flex-col items-center justify-center w-16 h-12 transition-colors ${
                        active ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'
                    }`}
                >
                    <div className={`${active ? 'transform -translate-y-1 scale-110' : ''} transition-all duration-300`}>
                        {icon}
                    </div>
                    <span className="text-[10px] font-medium mt-1">{label}</span>
                </button>
            );
        }

        // Renderiza o App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
