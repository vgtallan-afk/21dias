<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diário de Evolução</title>
    
    <!-- PWA Meta Tags Essenciais -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#fdf2f8">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192x192.png?text=DE">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- React, ReactDOM, Recharts & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: {
                            rose: '#F472B6', 
                            lavender: '#818CF8', 
                            light: '#FDF2F8', 
                            dark: '#0F172A'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base & Glassmorphism */
        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            background-color: #fdf2f8; 
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,0) 0, transparent 50%);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .tab-bar-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(226, 232, 240, 0.6);
        }

        ::-webkit-scrollbar { display: none; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 10px 0; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 8px; cursor: pointer; background: #e2e8f0; border-radius: 999px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 24px; width: 24px; border-radius: 50%;
            background: #F472B6; cursor: pointer; -webkit-appearance: none; margin-top: -8px;
            box-shadow: 0 2px 6px rgba(244, 114, 182, 0.4); border: 2px solid #fff;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
        
        .progress-ring__circle {
            transition: stroke-dashoffset 0.5s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        input[type="time"]::-webkit-calendar-picker-indicator {
            background: transparent;
            bottom: 0; color: transparent; cursor: pointer; height: auto; left: 0; position: absolute; right: 0; top: 0; width: auto;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen font-sans pb-24">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, Area, AreaChart, CartesianGrid } = window.Recharts;

        // --- SVGs Inline ---
        const Icon = {
            Clock: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>,
            Book: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            Activity: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
            Edit: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
            Download: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
            Check: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            Bell: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
            Target: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        };

        // --- PWA Setup ---
        function setupPWA() {
            const manifest = {
                name: "Diário de Evolução",
                short_name: "Evolução",
                start_url: ".",
                display: "standalone",
                background_color: "#fdf2f8",
                theme_color: "#F472B6",
                scope: "/",
                icons: [
                    { src: "https://via.placeholder.com/192x192.png?text=DE", sizes: "192x192", type: "image/png", purpose: "any" },
                    { src: "https://via.placeholder.com/512x512.png?text=DE", sizes: "512x512", type: "image/png", purpose: "any" }
                ]
            };

            const link = document.createElement('link');
            link.rel = 'manifest';
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);

            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE = 'evolucao-v1';
                    const URLS = ['/', '/index.html'];
                    self.addEventListener('install', e => {
                        e.waitUntil(caches.open(CACHE).then(c => c.addAll(URLS)));
                    });
                    self.addEventListener('fetch', e => {
                        e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(() => {});
            }

            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        // --- IndexedDB para armazenar PDFs ---
        const IDB = {
            db: null,
            async init() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open('DiarioEvolucao', 1);
                    req.onerror = () => reject();
                    req.onsuccess = () => { this.db = req.result; resolve(); };
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('pdfs')) db.createObjectStore('pdfs');
                    };
                });
            },
            async get(key) {
                if (!this.db) await this.init();
                return new Promise((resolve) => {
                    const req = this.db.transaction('pdfs').objectStore('pdfs').get(key);
                    req.onsuccess = () => resolve(req.result);
                });
            },
            async put(key, value) {
                if (!this.db) await this.init();
                return new Promise((resolve) => {
                    const req = this.db.transaction('pdfs', 'readwrite').objectStore('pdfs').put(value, key);
                    req.onsuccess = () => resolve(true);
                });
            }
        };

        // --- Onboarding Screen ---
        function OnboardingScreen({ onComplete }) {
            const [step, setStep] = useState(0);
            const [name, setName] = useState('');
            const [age, setAge] = useState('');

            const steps = [
                {
                    title: "Bem-vinda ao Diário de Evolução",
                    desc: "Seu companheiro de jornada para uma vida mais consciente e equilibrada",
                    icon: "🌸",
                    action: () => setStep(1)
                },
                {
                    title: "Como você se chama?",
                    desc: "Vamos personalizar sua experiência com seu nome",
                    icon: "👋",
                    input: { type: 'text', placeholder: 'Seu nome...', value: name, onChange: setName },
                    action: () => name && setStep(2),
                    disabled: !name
                },
                {
                    title: "Quantos anos você tem?",
                    desc: "Isso nos ajuda a personalizar as dicas e conteúdos",
                    icon: "🎂",
                    input: { type: 'number', placeholder: 'Sua idade...', value: age, onChange: setAge, min: 18, max: 120 },
                    action: () => age && onComplete({ name, age: parseInt(age) }),
                    disabled: !age
                }
            ];

            const current = steps[step];

            return (
                <div className="min-h-screen flex flex-col justify-center px-8 bg-white relative overflow-hidden animate-fade-in">
                    <div className="absolute top-[-10%] right-[-10%] w-72 h-72 bg-brand-rose/20 rounded-full blur-3xl"></div>
                    <div className="absolute bottom-[-10%] left-[-10%] w-72 h-72 bg-brand-lavender/20 rounded-full blur-3xl"></div>

                    <div className="z-10 w-full max-w-sm mx-auto">
                        <div className="text-center mb-10">
                            <div className="w-20 h-20 rounded-3xl bg-gradient-to-br from-brand-rose to-brand-lavender flex items-center justify-center text-4xl mx-auto mb-5 shadow-lg shadow-brand-rose/30">
                                {current.icon}
                            </div>
                            <h1 className="text-2xl font-bold text-slate-800 mb-2">{current.title}</h1>
                            <p className="text-slate-500 text-sm leading-relaxed">{current.desc}</p>
                        </div>

                        {current.input && (
                            <input
                                type={current.input.type}
                                placeholder={current.input.placeholder}
                                value={current.input.value}
                                onChange={(e) => current.input.onChange(e.target.value)}
                                min={current.input.min}
                                max={current.input.max}
                                onKeyDown={(e) => e.key === 'Enter' && !current.disabled && current.action()}
                                className="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 focus:border-brand-rose outline-none text-base transition-colors mb-4"
                            />
                        )}

                        <button
                            onClick={current.action}
                            disabled={current.disabled}
                            className="w-full py-4 bg-gradient-to-r from-brand-rose to-brand-lavender text-white rounded-2xl font-bold shadow-lg shadow-brand-rose/30 disabled:opacity-50 active:scale-95 transition-all">
                            {step === steps.length - 1 ? 'Começar minha jornada →' : 'Continuar →'}
                        </button>

                        {step > 0 && (
                            <button
                                onClick={() => setStep(step - 1)}
                                className="w-full mt-3 py-2 text-slate-600 font-medium hover:text-slate-800">
                                ← Voltar
                            </button>
                        )}

                        <div className="flex gap-1 mt-6 justify-center">
                            {steps.map((_, i) => <div key={i} className={`h-1 rounded-full transition-all ${i === step ? 'w-8 bg-brand-rose' : 'w-2 bg-slate-300'}`}></div>)}
                        </div>
                    </div>
                </div>
            );
        }

        // --- Diary Tab ---
        function DiaryTab({ user, logs, setLogs }) {
            const today = new Date().toISOString().split('T')[0];
            const todayLog = logs[today] || { mood: 5, energy: 5, motivation: 5, notes: '', checklist: [] };

            const handleChange = (field, value) => {
                setLogs({
                    ...logs,
                    [today]: { ...todayLog, [field]: value }
                });
            };

            return (
                <div className="animate-slide-up space-y-6">
                    <div>
                        <h2 className="text-xl font-bold px-1">{new Date(today).toLocaleDateString('pt-BR', { weekday: 'long', month: 'long', day: 'numeric' })}</h2>
                        <p className="text-sm text-slate-500 px-1">Como você está se sentindo hoje?</p>
                    </div>

                    <div className="space-y-4">
                        <SliderRow icon="😊" label="Humor" value={todayLog.mood} onChange={(v) => handleChange('mood', parseInt(v))} />
                        <SliderRow icon="⚡" label="Energia" value={todayLog.energy} onChange={(v) => handleChange('energy', parseInt(v))} />
                        <SliderRow icon="💪" label="Motivação" value={todayLog.motivation} onChange={(v) => handleChange('motivation', parseInt(v))} />
                    </div>

                    <div className="glass-card p-4 rounded-2xl">
                        <label className="text-sm font-semibold text-slate-700 mb-2 block">Notas do dia</label>
                        <textarea
                            value={todayLog.notes || ''}
                            onChange={(e) => handleChange('notes', e.target.value)}
                            placeholder="O que você aprendeu hoje? Como se sentiu?"
                            className="w-full p-3 rounded-xl bg-white/50 border border-white/30 outline-none text-sm resize-none h-24 focus:border-brand-rose"
                        />
                    </div>

                    <div>
                        <h3 className="text-sm font-semibold text-slate-700 mb-3">Checklist do dia</h3>
                        <div className="space-y-2">
                            {['Beber 2L de água', 'Meditar por 10min', 'Fazer exercício', 'Dormir cedo'].map((item, i) => (
                                <CheckItem
                                    key={i}
                                    label={item}
                                    checked={todayLog.checklist?.includes(i) || false}
                                    onClick={() => {
                                        const newChecklist = todayLog.checklist?.includes(i)
                                            ? todayLog.checklist.filter(x => x !== i)
                                            : [...(todayLog.checklist || []), i];
                                        handleChange('checklist', newChecklist);
                                    }}
                                />
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- TIMER TAB COM ESTÁGIOS DO JEJUM ---
        function TimerTab({ user, fasting, setFasting, notify }) {
            const [time, setTime] = useState(0);

            useEffect(() => {
                if (!fasting.isActive) return;
                
                const interval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - new Date(fasting.startTime).getTime()) / 1000);
                    setTime(elapsed);
                }, 1000);

                return () => clearInterval(interval);
            }, [fasting.isActive, fasting.startTime]);

            const toggleFasting = () => {
                if (!fasting.isActive) {
                    const newStart = new Date().toISOString();
                    setFasting({ isActive: true, startTime: newStart });
                    notify('Jejum iniciado! 🌙', 'Você começou seu jejum. Boa sorte!');
                } else {
                    setFasting({ isActive: false, startTime: null });
                    notify('Jejum finalizado! 🎉', `Você jejuou por ${formatTime(time)}`);
                    setTime(0);
                }
            };

            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            };

            // ESTÁGIOS DO JEJUM COM DESCRIÇÕES CIENTÍFICAS
            const stages = [
                {
                    min: 0, max: 4,
                    name: "Fase de Queima de Glicose",
                    icon: "🔥",
                    color: "from-yellow-400 to-orange-400",
                    description: "Seu corpo está usando a glicose disponível para energia",
                    details: [
                        "⏱️ Primeiras horas do jejum",
                        "🍯 Seu corpo queima carboidratos armazenados",
                        "💪 Níveis de insulina começam a cair",
                        "⚠️ Pode sentir um pouco de fome ainda"
                    ],
                    nextHours: "Nas próximas horas, seu corpo vai esgotar as reservas de glicose e começar a usar gordura como energia"
                },
                {
                    min: 4, max: 8,
                    name: "Inicio da Queima de Gordura",
                    icon: "🔄",
                    color: "from-orange-400 to-red-400",
                    description: "Transição para a queimação de gordura começando",
                    details: [
                        "⏱️ Horas 4-8 do jejum",
                        "🧬 Glucagon aumenta, insulina diminui significativamente",
                        "🔓 Células começam a liberar gordura armazenada",
                        "💪 Pode sentir mais foco e energia"
                    ],
                    nextHours: "Seu metabolismo vai acelerar a queima de gordura. Você pode sentir mais clareza mental e disposição"
                },
                {
                    min: 8, max: 12,
                    name: "Queima de Gordura Ativa",
                    icon: "⚡",
                    color: "from-red-400 to-pink-400",
                    description: "Corpo em queima otimizada de gordura (Lipolise)",
                    details: [
                        "⏱️ Horas 8-12 do jejum",
                        "🔥 Taxa de queima de gordura em alta",
                        "🧠 Produção de cetonas aumentando",
                        "✨ Maior clareza mental e foco"
                    ],
                    nextHours: "Seu corpo está queimando gordura de forma eficiente. A clareza mental tende a aumentar"
                },
                {
                    min: 12, max: 16,
                    name: "Estado de Cetose",
                    icon: "🧠",
                    color: "from-pink-400 to-purple-400",
                    description: "Corpos cetônicos como principal fonte de energia",
                    details: [
                        "⏱️ Horas 12-16 do jejum (Autofagia ativa!)",
                        "🔬 Cetonas substituem glicose como energia",
                        "🧹 Célula em 'limpeza' (Autofagia)",
                        "🎯 Máximo benefício para saúde do cérebro"
                    ],
                    nextHours: "Você está em estado ótimo de queima de gordura. Autofagia (regeneração celular) está em pico"
                },
                {
                    min: 16, max: 24,
                    name: "Jejum Prolongado",
                    icon: "🌙",
                    color: "from-purple-400 to-indigo-400",
                    description: "Máximo benefício de regeneração celular",
                    details: [
                        "⏱️ Horas 16-24 do jejum",
                        "🔧 Autofagia em pico máximo",
                        "🧬 Reparação de DNA acelerada",
                        "💎 Máximos benefícios anti-envelhecimento"
                    ],
                    nextHours: "Você atingiu um dos melhores períodos para regeneração celular. Sua saúde está sendo otimizada"
                },
                {
                    min: 24, max: 72,
                    name: "Jejum Muito Prolongado",
                    icon: "🌟",
                    color: "from-indigo-400 to-blue-400",
                    description: "Benefícios máximos de saúde e longevidade",
                    details: [
                        "⏱️ Acima de 24 horas",
                        "🔬 Fatores de crescimento aumentados",
                        "🧠 Neuroplasticidade aprimorada",
                        "⚖️ Balanço hormonal otimizado"
                    ],
                    nextHours: "Seu corpo está em regeneração profunda. Continue observando como se sente"
                }
            ];

            // Encontrar estágio atual
            const hours = Math.floor(time / 3600);
            const currentStage = stages.find(s => hours >= s.min && hours < s.max) || stages[0];

            return (
                <div className="animate-slide-up space-y-6">
                    <div>
                        <h2 className="text-xl font-bold px-1 mb-1">Seu Jejum</h2>
                        <p className="text-sm text-slate-500 px-1">Acompanhe seu progresso de jejum</p>
                    </div>

                    {/* Timer Principal */}
                    <div className={`glass-card p-8 rounded-3xl text-center bg-gradient-to-br ${currentStage.color} bg-opacity-10 border-0`}>
                        <div className="text-5xl font-bold text-slate-800 font-mono mb-2">{formatTime(time)}</div>
                        <p className="text-sm text-slate-600 mb-6">Tempo de jejum</p>
                        
                        <button
                            onClick={toggleFasting}
                            className={`w-full py-4 rounded-2xl font-bold text-white transition-all active:scale-95 ${
                                fasting.isActive
                                    ? 'bg-gradient-to-r from-red-400 to-pink-500 shadow-lg shadow-red-400/30'
                                    : 'bg-gradient-to-r from-brand-rose to-brand-lavender shadow-lg shadow-brand-rose/30'
                            }`}>
                            {fasting.isActive ? '⏸ Pausar Jejum' : '▶ Iniciar Jejum'}
                        </button>
                    </div>

                    {/* Card do Estágio Atual */}
                    <div className={`glass-card p-6 rounded-2xl border-2 border-${currentStage.color.split('-')[1]}-300 bg-gradient-to-br ${currentStage.color} bg-opacity-5`}>
                        <div className="flex items-center gap-3 mb-4">
                            <span className="text-3xl">{currentStage.icon}</span>
                            <div>
                                <h3 className="font-bold text-slate-800 text-lg">{currentStage.name}</h3>
                                <p className="text-xs text-slate-500">{currentStage.description}</p>
                            </div>
                        </div>

                        {/* Details do Estágio */}
                        <div className="space-y-2 mb-4">
                            {currentStage.details.map((detail, i) => (
                                <div key={i} className="text-sm text-slate-700 leading-relaxed">
                                    {detail}
                                </div>
                            ))}
                        </div>

                        {/* Próximas Horas */}
                        <div className="bg-white/40 rounded-xl p-3 mt-4">
                            <p className="text-xs font-semibold text-slate-700 mb-1">📌 Próximas horas:</p>
                            <p className="text-sm text-slate-700 leading-relaxed">{currentStage.nextHours}</p>
                        </div>
                    </div>

                    {/* Timeline de Estágios */}
                    <div>
                        <h3 className="text-sm font-semibold text-slate-700 mb-3">Estágios do Jejum</h3>
                        <div className="space-y-2">
                            {stages.map((stage, i) => (
                                <div
                                    key={i}
                                    className={`p-3 rounded-xl text-sm transition-all ${
                                        stage.min <= hours && hours < stage.max
                                            ? `bg-gradient-to-r ${stage.color} text-white font-semibold`
                                            : 'bg-slate-100 text-slate-600'
                                    }`}>
                                    {stage.icon} {stage.name} ({stage.min}-{stage.max}h)
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Dicas */}
                    <div className="glass-card p-4 rounded-xl text-sm space-y-2 text-slate-700">
                        <p className="font-semibold mb-2">💡 Dicas importantes:</p>
                        <p>• Beba muita água durante o jejum</p>
                        <p>• Café e chá sem açúcar são permitidos</p>
                        <p>• Durma bem - regeneração acontece durante o sono</p>
                        <p>• Ouça seu corpo - se sentir muito mal, quebre o jejum</p>
                    </div>
                </div>
            );
        }

        // --- Dashboard Tab ---
        function DashboardTab({ user, logs }) {
            const logsArray = Object.entries(logs).map(([date, data]) => ({
                date,
                ...data,
                avg: Math.round((data.mood + data.energy + data.motivation) / 3)
            })).slice(-7);

            return (
                <div className="animate-slide-up space-y-6">
                    <div>
                        <h2 className="text-xl font-bold px-1">Sua Evolução</h2>
                        <p className="text-sm text-slate-500 px-1">Acompanhe seu progresso dos últimos 7 dias</p>
                    </div>

                    <div className="glass-card p-6 rounded-2xl h-64">
                        <ResponsiveContainer width="100%" height="100%">
                            <LineChart data={logsArray}>
                                <CartesianGrid strokeDasharray="3 3" stroke="rgba(0,0,0,0.1)" />
                                <XAxis dataKey="date" stroke="rgba(0,0,0,0.3)" />
                                <YAxis stroke="rgba(0,0,0,0.3)" />
                                <Tooltip contentStyle={{ borderRadius: 8, border: 'none', boxShadow: '0 4px 12px rgba(0,0,0,0.1)' }} />
                                <Line type="monotone" dataKey="avg" stroke="#F472B6" strokeWidth={2} dot={{ fill: '#F472B6' }} />
                            </LineChart>
                        </ResponsiveContainer>
                    </div>

                    <div className="grid grid-cols-3 gap-3">
                        {[
                            { label: 'Dias', value: logsArray.length },
                            { label: 'Humilidade Média', value: logsArray.length > 0 ? Math.round(logsArray.reduce((a, l) => a + l.mood, 0) / logsArray.length) : 0 },
                            { label: 'Melhor Dia', value: logsArray.length > 0 ? Math.max(...logsArray.map(l => l.avg)) : 0 }
                        ].map((stat, i) => (
                            <div key={i} className="glass-card p-4 rounded-xl text-center">
                                <p className="text-2xl font-bold text-brand-rose mb-1">{stat.value}</p>
                                <p className="text-xs text-slate-500 font-medium">{stat.label}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- Library Tab COM FIX DO BUG ---
        function LibraryTab() {
            const [statuses, setStatus] = useState({});
            const [progress, setProgress] = useState({});
            const statusRef = useRef({});

            const BOOKS = [
                { id: 'book1', title: 'Guia do Jejum Intermitente', subtitle: 'Tudo que você precisa saber', emoji: '📚', color: 'from-blue-400 to-cyan-400' },
                { id: 'book2', title: 'Nutrição Inteligente', subtitle: 'Como alimentar seu corpo', emoji: '🥗', color: 'from-green-400 to-emerald-400' },
                { id: 'book3', title: 'Protocolo de 21 Dias', subtitle: 'Seu plano de ação', emoji: '📅', color: 'from-pink-400 to-rose-400' },
            ];

            const handleOpen = async (book) => {
                const currentStatus = statusRef.current[book.id];

                // Se já foi baixado, só abre (não tenta baixar de novo)
                if (currentStatus === 'cached') {
                    window.open(`https://drive.google.com/file/d/${book.id}/view`, '_blank');
                    return;
                }

                // Se já está baixando ou abrindo, ignora o clique
                if (currentStatus === 'downloading' || currentStatus === 'opening') {
                    return;
                }

                // Inicia download
                updateStatus(book.id, 'downloading');

                try {
                    const response = await fetch(`https://drive.google.com/uc?id=${book.id}&export=download`);
                    
                    if (!response.ok) throw new Error('Erro ao baixar');

                    const blob = await response.blob();
                    
                    // Salva no IndexedDB
                    await IDB.put(book.id, blob);
                    
                    // Marca como salvo
                    updateStatus(book.id, 'cached');
                    
                    // Abre o arquivo
                    updateStatus(book.id, 'opening');
                    const url = URL.createObjectURL(blob);
                    window.open(url, '_blank');
                    
                    // Remove o status 'opening' após 2 segundos
                    setTimeout(() => {
                        if (statusRef.current[book.id] === 'opening') {
                            updateStatus(book.id, 'cached');
                        }
                    }, 2000);

                } catch(err) {
                    // Se falhar, abre no Drive e marca como 'cached' para não tentar download de novo
                    window.open(`https://drive.google.com/file/d/${book.id}/view`, '_blank');
                    updateStatus(book.id, 'cached');
                }
            };

            const updateStatus = (bookId, status) => {
                statusRef.current[bookId] = status;
                setStatus({ ...statusRef.current });
            };

            return (
                <div className="animate-slide-up space-y-6">
                    <div>
                        <h2 className="text-xl font-bold px-1 mb-1">Biblioteca VIP</h2>
                        <p className="text-sm text-slate-500 px-1 mb-4">Seus materiais exclusivos. Baixe uma vez e acesse sempre.</p>
                    </div>

                    <div className="grid grid-cols-1 gap-3">
                        {BOOKS.map((book) => {
                            const status = statusRef.current[book.id] || 'idle';
                            const isCached = status === 'cached';
                            const isDownloading = status === 'downloading';

                            return (
                                <div
                                    key={book.id}
                                    onClick={() => handleOpen(book)}
                                    className={`bg-white p-4 rounded-2xl flex items-center justify-between cursor-pointer shadow-sm border transition-all active:scale-95
                                        ${isCached ? 'border-emerald-100 bg-emerald-50/30' : 'border-slate-100'}
                                        ${isDownloading ? 'opacity-90' : ''}`}>
                                    <div className="flex items-center gap-4 flex-1 min-w-0">
                                        <div className={`w-14 h-14 rounded-xl bg-gradient-to-br ${book.color} flex items-center justify-center text-2xl shadow-inner shrink-0`}>
                                            {book.emoji}
                                        </div>
                                        <div className="min-w-0 flex-1">
                                            <h3 className="font-bold text-slate-800 text-sm leading-snug">{book.title}</h3>
                                            <p className="text-xs text-slate-500 font-medium mt-0.5">{book.subtitle}</p>
                                            {isDownloading && (
                                                <div className="mt-2">
                                                    <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                                        <div className="h-full bg-gradient-to-r from-brand-rose to-brand-lavender rounded-full animate-pulse"></div>
                                                    </div>
                                                    <p className="text-[10px] text-slate-400 mt-1">Baixando...</p>
                                                </div>
                                            )}
                                            {isCached && !isDownloading && (
                                                <p className="text-[10px] text-emerald-500 font-semibold mt-1">✓ Salvo no dispositivo</p>
                                            )}
                                        </div>
                                    </div>
                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center shrink-0 ml-2 transition-colors
                                        ${isCached ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-50 text-slate-400'}`}>
                                        {isDownloading ? (
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="animate-spin text-brand-rose">
                                                <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                                            </svg>
                                        ) : isCached ? (
                                            <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                                                <polyline points="20 6 9 17 4 12"/>
                                            </svg>
                                        ) : (
                                            <Icon.Download />
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <p className="text-center text-xs text-slate-400 pb-2">
                        📁 PDFs salvos ficam disponíveis mesmo sem internet
                    </p>
                </div>
            );
        }

        // --- Utils ---
        function SliderRow({ icon, label, value, onChange }) {
            let colorClass = 'text-yellow-500';
            if (value >= 8) colorClass = 'text-emerald-500';
            else if (value <= 3) colorClass = 'text-rose-500';

            return (
                <div>
                    <div className="flex justify-between text-sm mb-1">
                        <span className="flex gap-2 items-center text-slate-600 font-medium"><span className="text-lg">{icon}</span> {label}</span>
                        <span className={`font-bold ${colorClass}`}>{value}/10</span>
                    </div>
                    <input type="range" min="1" max="10" value={value} onChange={e => onChange(parseInt(e.target.value))} />
                </div>
            );
        }

        function CheckItem({ label, checked, onClick }) {
            return (
                <div onClick={onClick} className={`flex items-center gap-3 p-3.5 rounded-xl border cursor-pointer active:scale-95 transition-all ${checked ? 'bg-slate-50 border-transparent' : 'bg-white border-slate-100 shadow-sm'}`}>
                    <div className={`w-6 h-6 rounded-md flex items-center justify-center transition-colors shrink-0 ${checked ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-transparent'}`}>
                        <Icon.Check />
                    </div>
                    <span className={`text-[13px] font-medium leading-snug ${checked ? 'text-slate-400 line-through' : 'text-slate-700'}`}>{label}</span>
                </div>
            );
        }

        function TabBtn({ icon, label, active, onClick }) {
            return (
                <button onClick={onClick} className={`flex flex-col items-center justify-center w-16 transition-colors ${active ? 'text-brand-rose' : 'text-slate-400 hover:text-slate-600'}`}>
                    <div className={`${active ? 'transform -translate-y-1 scale-110 drop-shadow-md' : ''} transition-all duration-300`}>
                        {icon}
                    </div>
                    <span className="text-[10px] font-bold mt-1 tracking-wide">{label}</span>
                </button>
            );
        }

        // --- MAIN APP ---
        function App() {
            const [isLoaded, setIsLoaded] = useState(false);
            const [emailVerified, setEmailVerified] = useState(false);
            const [user, setUser] = useState(null);
            const [logs, setLogs] = useState({});
            const [fasting, setFasting] = useState({ isActive: false, startTime: null });
            const [activeTab, setActiveTab] = useState('diary');

            useEffect(() => { window.scrollTo(0, 0); }, [activeTab]);

            useEffect(() => {
                const savedUser = JSON.parse(localStorage.getItem('depro_user'));
                const savedLogs = JSON.parse(localStorage.getItem('depro_logs')) || {};
                const savedFasting = JSON.parse(localStorage.getItem('depro_fasting')) || { isActive: false, startTime: null };
                const savedEmail = localStorage.getItem('depro_email');

                if (savedEmail) setEmailVerified(true);
                if (savedUser) setUser(savedUser);
                setLogs(savedLogs);
                setFasting(savedFasting);

                setupPWA();
                setIsLoaded(true);
            }, []);

            useEffect(() => {
                if (isLoaded) {
                    if (user) localStorage.setItem('depro_user', JSON.stringify(user));
                    localStorage.setItem('depro_logs', JSON.stringify(logs));
                    localStorage.setItem('depro_fasting', JSON.stringify(fasting));
                }
            }, [user, logs, fasting, isLoaded]);

            const notify = (title, body) => {
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification(title, { body, icon: "https://via.placeholder.com/192x192.png?text=DE" });
                }
            };

            const handleEmailVerified = (email) => {
                localStorage.setItem('depro_email', email);
                setEmailVerified(true);
            };

            if (!isLoaded) return null;
            if (!emailVerified) return <EmailGateScreen onComplete={handleEmailVerified} />;
            if (!user) return <OnboardingScreen onComplete={setUser} />;

            return (
                <div className="max-w-md mx-auto relative min-h-screen overflow-x-hidden">
                    <header className="px-6 pt-8 pb-4 flex justify-between items-center z-10 relative">
                        <div>
                            <p className="text-sm font-medium text-slate-500">Jornada 21 Dias ✨</p>
                            <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-rose to-brand-lavender">
                                Oi, {user.name.split(' ')[0]}
                            </h1>
                        </div>
                        <div className="w-12 h-12 rounded-full glass-card flex items-center justify-center shadow-sm text-2xl">
                            🌸
                        </div>
                    </header>

                    <main className="px-6 pb-28">
                        {activeTab === 'diary' && <DiaryTab user={user} logs={logs} setLogs={setLogs} />}
                        {activeTab === 'timer' && <TimerTab user={user} fasting={fasting} setFasting={setFasting} notify={notify} />}
                        {activeTab === 'dash' && <DashboardTab user={user} logs={logs} />}
                        {activeTab === 'library' && <LibraryTab />}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 w-full tab-bar-glass pb-safe pt-2 px-2 z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                        <div className="max-w-md mx-auto flex justify-around items-center h-16">
                            <TabBtn icon={<Icon.Edit/>} label="Diário" active={activeTab==='diary'} onClick={()=>setActiveTab('diary')} />
                            <TabBtn icon={<Icon.Clock/>} label="Jejum" active={activeTab==='timer'} onClick={()=>setActiveTab('timer')} />
                            <TabBtn icon={<Icon.Activity/>} label="Evolução" active={activeTab==='dash'} onClick={()=>setActiveTab('dash')} />
                            <TabBtn icon={<Icon.Book/>} label="Biblioteca" active={activeTab==='library'} onClick={()=>setActiveTab('library')} />
                        </div>
                    </nav>
                </div>
            );
        }

        // --- Email Gate Screen ---
        function EmailGateScreen({ onComplete }) {
            const [email, setEmail] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const isValidEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

            const handleSubmit = () => {
                if (!isValidEmail(email)) {
                    setError('Digite um e-mail válido');
                    return;
                }
                setLoading(true);
                setTimeout(() => { onComplete(email.toLowerCase().trim()); }, 1500);
            };

            return (
                <div className="min-h-screen flex flex-col justify-center px-8 bg-white relative overflow-hidden animate-fade-in">
                    <div className="absolute top-[-10%] right-[-10%] w-72 h-72 bg-brand-rose/20 rounded-full blur-3xl"></div>
                    <div className="absolute bottom-[-10%] left-[-10%] w-72 h-72 bg-brand-lavender/20 rounded-full blur-3xl"></div>

                    <div className="z-10 w-full max-w-sm mx-auto">
                        <div className="text-center mb-10">
                            <div className="w-20 h-20 rounded-3xl bg-gradient-to-br from-brand-rose to-brand-lavender flex items-center justify-center text-4xl mx-auto mb-5 shadow-lg shadow-brand-rose/30">
                                🌸
                            </div>
                            <h1 className="text-2xl font-bold text-slate-800 mb-2">Bem-vinda ao Plano 21 Dias</h1>
                            <p className="text-slate-500 text-sm">Confirme seu e-mail de compra para acessar o conteúdo exclusivo</p>
                        </div>

                        <div>
                            <input
                                type="email"
                                placeholder="seu@email.com"
                                value={email}
                                onChange={e => { setEmail(e.target.value); setError(''); }}
                                onKeyDown={e => e.key === 'Enter' && handleSubmit()}
                                className="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 focus:border-brand-rose outline-none text-base transition-colors mb-4"
                            />
                            {error && <p className="text-xs text-red-500 mb-4 font-medium">{error}</p>}

                            <button
                                onClick={handleSubmit}
                                disabled={!email || loading}
                                className="w-full py-4 bg-gradient-to-r from-brand-rose to-brand-lavender text-white rounded-2xl font-bold shadow-lg shadow-brand-rose/30 disabled:opacity-50 active:scale-95 transition-all">
                                {loading ? 'Verificando...' : 'Acessar meu conteúdo →'}
                            </button>
                        </div>

                        <p className="text-center text-xs text-slate-400 mt-6">
                            🔒 Acesso exclusivo para alunas.<br/>Este conteúdo é intransferível e protegido.
                        </p>
                    </div>
                </div>
            );
        }

        // React Init
        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        }
    </script>
</body>
</html>
